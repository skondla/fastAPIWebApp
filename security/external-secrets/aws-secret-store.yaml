---
# ─────────────────────────────────────────────────────────────────────────────
# External Secrets Operator — AWS Secrets Manager backend
# Closes gap: "Plain Kubernetes secrets — base64 Secret, no external provider".
#
# The operator pulls live values from AWS Secrets Manager and projects them into
# a Kubernetes Secret at runtime. The base64 `secret.yaml` manifests are removed
# from the deploy step (see workflows) — this becomes the single source.
#
# Requires: external-secrets.io operator installed, and the SecretStore's
# ServiceAccount bound (via IRSA) to an IAM role with
# secretsmanager:GetSecretValue on the referenced secrets.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: fastapi-namespace
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: fastapi-sa          # IRSA-annotated SA (see namespace.yaml)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fastapi-db-secret
  namespace: fastapi-namespace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: fastapi-db-secret          # same name the Deployment's envFrom expects
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: shost
      remoteRef: { key: fastapi/db, property: host }
    - secretKey: sport
      remoteRef: { key: fastapi/db, property: port }
    - secretKey: suser
      remoteRef: { key: fastapi/db, property: user }
    - secretKey: spassword
      remoteRef: { key: fastapi/db, property: password }
    - secretKey: sdatabase
      remoteRef: { key: fastapi/db, property: dbname }
    - secretKey: SECRET_KEY
      remoteRef: { key: fastapi/jwt, property: secret_key }
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: fastapi-admin-namespace
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: fastapi-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fastapi-db-secret
  namespace: fastapi-admin-namespace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: fastapi-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: shost
      remoteRef: { key: fastapi-admin/db, property: host }
    - secretKey: sport
      remoteRef: { key: fastapi-admin/db, property: port }
    - secretKey: suser
      remoteRef: { key: fastapi-admin/db, property: user }
    - secretKey: spassword
      remoteRef: { key: fastapi-admin/db, property: password }
    - secretKey: sdatabase
      remoteRef: { key: fastapi-admin/db, property: dbname }
    - secretKey: SECRET_KEY
      remoteRef: { key: fastapi-admin/jwt, property: secret_key }
