---
# ArgoCD Application — ADMIN app on EKS (single delivery authority; see USER app
# for the push/pull-duality rationale).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-admin-eks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/skondla/fastAPIWebApp.git
    targetRevision: main
    path: aws/eks/deploy/manifest/fastapi-admin
  destination:
    server: https://kubernetes.default.svc
    namespace: fastapi-admin-namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
