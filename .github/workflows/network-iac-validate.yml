# ──────────────────────────────────────────────────────────────────────────────
# Multi-cloud network IaC — validation + security scan
#
# Runs on PRs that touch provisioning/terraform/. Gates merge on:
#   1. terraform fmt + validate (every env directory)
#   2. tflint
#   3. tfsec  (severity = ERROR fails)
#   4. checkov (HIGH/CRITICAL fails)
#   5. conftest against the OPA policies in _global/guardrails/conftest/policy
#   6. terraform plan (no apply) — surface the plan as a PR artifact
#
# Plans run with placeholder tfvars (envs/prod/*/terraform.tfvars.example) so
# we don't need real cloud creds for PR validation.
# ──────────────────────────────────────────────────────────────────────────────
name: Network IaC Validate

on:
  pull_request:
    paths:
      - 'provisioning/terraform/**'
      - '.github/workflows/network-iac-validate.yml'
  push:
    branches: [main, multi-cloud-network-infra]
    paths:
      - 'provisioning/terraform/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write   # for OIDC to cloud providers in later phases

concurrency:
  group: network-iac-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: '1.9.8'
  TFLINT_VERSION: 'v0.53.0'
  TFSEC_VERSION: 'v1.28.10'
  CHECKOV_VERSION: '3.2.255'
  CONFTEST_VERSION: '0.55.0'
  TF_IN_AUTOMATION: 'true'

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff provisioning/terraform

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - provisioning/terraform/envs/prod/aws
          - provisioning/terraform/envs/prod/azure
          - provisioning/terraform/envs/prod/gcp
          - provisioning/terraform/envs/prod/cross-cloud
          - provisioning/terraform/envs/prod/cross-cloud-alternatives/option-b-aws-tgw-hub
          - provisioning/terraform/envs/prod/cross-cloud-alternatives/option-c-megaport-sdn
          - provisioning/terraform/envs/prod/cross-cloud-alternatives/option-d-azure-vwan-hub
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init -backend=false
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init
      - run: tflint --recursive --minimum-failure-severity=warning provisioning/terraform

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: provisioning/terraform
          config_file: provisioning/terraform/_global/guardrails/tfsec/.tfsec/config.yml
          additional_args: --concise-output --soft-fail=false

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install checkov
        run: pip install checkov==${{ env.CHECKOV_VERSION }}
      - name: run checkov
        run: checkov --config-file provisioning/terraform/_global/guardrails/checkov/.checkov.yaml

  conftest:
    name: conftest (OPA)
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        dir:
          - provisioning/terraform/envs/prod/aws
          - provisioning/terraform/envs/prod/azure
          - provisioning/terraform/envs/prod/gcp
          - provisioning/terraform/envs/prod/cross-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/
      - name: terraform init + plan (-refresh=false, no creds)
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          # Generate plan in JSON form for OPA. With no creds the plan exits with errors,
          # but `terraform show -json` on the partial plan still gives us resource_changes.
          terraform plan -refresh=false -input=false -lock=false -out=tfplan.bin 2>plan.err || true
          terraform show -json tfplan.bin > tfplan.json 2>/dev/null || true
          test -s tfplan.json
      - name: conftest test
        working-directory: ${{ matrix.dir }}
        run: |
          conftest test --policy ../../../../_global/guardrails/conftest/policy tfplan.json

  plan-summary:
    name: plan summary
    runs-on: ubuntu-latest
    needs: [fmt, validate, tflint, tfsec, checkov, conftest]
    if: always()
    steps:
      - name: emit summary
        run: |
          echo "### Network IaC Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage     | Result                                |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------------------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| fmt       | ${{ needs.fmt.result }}               |" >> $GITHUB_STEP_SUMMARY
          echo "| validate  | ${{ needs.validate.result }}          |" >> $GITHUB_STEP_SUMMARY
          echo "| tflint    | ${{ needs.tflint.result }}            |" >> $GITHUB_STEP_SUMMARY
          echo "| tfsec     | ${{ needs.tfsec.result }}             |" >> $GITHUB_STEP_SUMMARY
          echo "| checkov   | ${{ needs.checkov.result }}           |" >> $GITHUB_STEP_SUMMARY
          echo "| conftest  | ${{ needs.conftest.result }}          |" >> $GITHUB_STEP_SUMMARY
