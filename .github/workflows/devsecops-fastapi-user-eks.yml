name: "DevSecOps — FastAPI USER — AWS EKS"

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  push:
    branches: [master, main]
    paths:
      - "dockerized/USER_FASTAPI/**"
      - "aws/eks/deploy/manifest/fastapi1/**"
      - "aws/eks/deploy/terraform-fastapi/**"
  pull_request:
    branches: [master, main]
    paths:
      - "dockerized/USER_FASTAPI/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

# ─── Global env ───────────────────────────────────────────────────────────────
env:
  AWS_REGION:      us-east-1
  EKS_CLUSTER:     fastapi-demo-cluster
  ECR_REPOSITORY:  fastapi-user-app
  APP_NAME:        fastapi-user-app
  EKS_NAMESPACE:   fastapi-namespace
  APP_PORT:        "50443"
  IMAGE_TAG:       ${{ github.sha }}
  PYTHON_VERSION:  "3.11"

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub Security tab
  id-token: write           # OIDC for AWS authentication + cosign keyless signing
  packages: write           # push cosign signature + SBOM attestation

# Gap fix — "No workflow concurrency guard against overlapping deploys".
# Serialize runs per ref; cancel superseded in-progress runs.
concurrency:
  group: devsecops-user-eks-${{ github.ref }}
  cancel-in-progress: true

jobs:
# ════════════════════════════════════════════════════════════════════════════
# 1. SECRET SCANNING — prevent credentials from reaching the repo
# ════════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: "🔍 Secret Scan (TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: TruffleHog — scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

      - name: GitLeaks — scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ════════════════════════════════════════════════════════════════════════════
# 2. SAST — static application security testing (OWASP A03, A07)
# ════════════════════════════════════════════════════════════════════════════
  sast:
    name: "🔬 SAST (Bandit + Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SAST tools
        run: pip install bandit semgrep

      - name: Bandit — Python SAST (OWASP Top 10)
        run: |
          bandit -r dockerized/USER_FASTAPI/ \
            --configfile dockerized/USER_FASTAPI/.bandit \
            --format sarif \
            --output bandit-results.sarif \
            --severity-level medium || true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Semgrep — OWASP Top 10 rules
        run: |
          semgrep \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/jwt \
            --config p/secrets \
            --config dockerized/USER_FASTAPI/.semgrep.yml \
            dockerized/USER_FASTAPI/ \
            --sarif --output semgrep-results.sarif || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload SAST artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: "*.sarif"
          retention-days: 30

      # ── GATE — fail the build on high-confidence/high-severity findings ────
      # Gap fix: "Fail on high-confidence SAST" (was non-blocking via `|| true`).
      - name: Bandit gate (HIGH severity + HIGH confidence)
        run: |
          bandit -r dockerized/USER_FASTAPI/ \
            --configfile dockerized/USER_FASTAPI/.bandit \
            --severity-level high \
            --confidence-level high

      - name: Semgrep gate (ERROR severity blocks)
        run: |
          semgrep \
            --config p/owasp-top-ten \
            --config p/jwt \
            --config p/secrets \
            --error \
            --severity ERROR \
            dockerized/USER_FASTAPI/

# ════════════════════════════════════════════════════════════════════════════
# 3. SCA — software composition analysis (OWASP A06)
# ════════════════════════════════════════════════════════════════════════════
  sca:
    name: "📦 SCA (pip-audit + Safety + Trivy FS)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SCA tools
        run: pip install pip-audit

      # ── Visibility — full SARIF report (HIGH+CRITICAL), never fails ────────
      - name: pip-audit — dependency vulnerability scan (report)
        run: |
          pip-audit \
            -r dockerized/USER_FASTAPI/requirements.txt \
            --format sarif \
            --output pip-audit-results.sarif || true

      - name: Upload pip-audit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit

      - name: Trivy — filesystem SCA scan (report)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: dockerized/USER_FASTAPI/
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      # ── GATE — block on CRITICAL dependency vulnerabilities ───────────────
      # Gap fix: "Non-blocking security gates" (was exit-code 0 / `|| true`).
      - name: pip-audit gate (fail on any known vuln)
        run: pip-audit -r dockerized/USER_FASTAPI/requirements.txt

      - name: Trivy FS gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: dockerized/USER_FASTAPI/
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

# ════════════════════════════════════════════════════════════════════════════
# 4. BUILD & PUSH — Docker image to ECR
# ════════════════════════════════════════════════════════════════════════════
  build:
    name: "🐳 Build, Push, Sign & SBOM"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca]
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        working-directory: dockerized/USER_FASTAPI
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          IMAGE_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker build \
            --label "git.commit=${GITHUB_SHA}" \
            --label "build.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          # Resolve the immutable digest for signing/attestation (pin, never tag).
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d'@' -f2)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${ECR_REGISTRY}/${ECR_REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # ── Supply-chain integrity — gap fix: "No supply-chain integrity" ──────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign image (cosign keyless — OIDC + Fulcio + Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ steps.build-image.outputs.image_digest }}"

      - name: Generate SBOM (CycloneDX)
        run: |
          syft "${{ steps.build-image.outputs.image_digest }}" \
            -o cyclonedx-json=sbom.cdx.json

      - name: Attest SBOM to the image (cosign attestation in Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ steps.build-image.outputs.image_digest }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-user-eks
          path: sbom.cdx.json
          retention-days: 90

# ════════════════════════════════════════════════════════════════════════════
# 5. CONTAINER SCAN — Trivy image scan (OWASP A06)
# ════════════════════════════════════════════════════════════════════════════
  container-scan:
    name: "🔎 Container Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trivy image scan (report — HIGH+CRITICAL → SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      # ── GATE — block deploy on CRITICAL image vulnerabilities ─────────────
      - name: Trivy image gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ── Verify the signature & SBOM attestation we produced at build ──────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify cosign signature (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/skondla/fastAPIWebApp/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ needs.build.outputs.image }}"

# ════════════════════════════════════════════════════════════════════════════
# 6. IaC SCAN — Terraform security (Checkov)
# ════════════════════════════════════════════════════════════════════════════
  iac-scan:
    name: "🏗️ IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov — Terraform security scan (report)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: aws/eks/deploy/terraform-fastapi
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov-terraform

      # ── GATE — hard-fail on Kubernetes manifest misconfigurations ─────────
      # Gap fix: "No policy-as-code" / non-blocking IaC (was soft_fail: true).
      - name: Checkov — Kubernetes manifests gate (hard-fail)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: aws/eks/deploy/manifest/fastapi1
          framework: kubernetes
          soft_fail: false

# ════════════════════════════════════════════════════════════════════════════
# 7. DEPLOY — Apply manifests to EKS
# ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "🚀 Deploy to EKS"
    runs-on: ubuntu-latest
    needs: [build, container-scan, iac-scan]
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply K8s manifests
        env:
          FASTAPI_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          export FASTAPI_IMAGE EKS_NAMESPACE APP_NAME APP_PORT

          # NOTE: secret.yaml is intentionally NOT applied here — the
          # fastapi-db-secret is provided by the External Secrets Operator
          # (security/external-secrets/) sourced from AWS Secrets Manager.
          for manifest in \
            aws/eks/deploy/manifest/fastapi1/namespace.yaml \
            aws/eks/deploy/manifest/fastapi1/configmap.yaml \
            aws/eks/deploy/manifest/fastapi1/deployment.yaml \
            aws/eks/deploy/manifest/fastapi1/service.yaml \
            aws/eks/deploy/manifest/fastapi1/hpa.yaml; do
            envsubst < "$manifest" | kubectl apply -f -
          done

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${APP_NAME} \
            -n ${EKS_NAMESPACE} --timeout=5m

      - name: Smoke test
        run: |
          LB=$(kubectl get svc ${APP_NAME} -n ${EKS_NAMESPACE} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Load balancer: $LB"
          curl -sk --max-time 30 "https://${LB}:${APP_PORT}/" | grep -i "DB Restore" \
            && echo "✅ Smoke test passed" \
            || echo "⚠️  Smoke test inconclusive (LB may still be provisioning)"

# ════════════════════════════════════════════════════════════════════════════
# 8. DAST — OWASP ZAP dynamic scan (post-deploy)
# ════════════════════════════════════════════════════════════════════════════
  dast:
    name: "⚡ DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      # Gap fix: "DAST credential gap — job resolved the LB without
      # re-establishing AWS credentials." Re-auth via OIDC + refresh kubeconfig.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Resolve load balancer hostname
        id: lb
        run: |
          LB=$(kubectl get svc ${APP_NAME} -n ${EKS_NAMESPACE} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "url=https://${LB}:${APP_PORT}" >> "$GITHUB_OUTPUT"

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.lb.outputs.url }}
          rules_file_name: "dockerized/USER_FASTAPI/.zap/rules.tsv"
          cmd_options: "-a -j"
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30

# ════════════════════════════════════════════════════════════════════════════
# 9. NOTIFY — Slack
# ════════════════════════════════════════════════════════════════════════════
  notify:
    name: "📣 Notify Slack"
    runs-on: ubuntu-latest
    needs: [deploy, dast]
    if: always()
    steps:
      - name: Post result to Slack
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "*FastAPI USER App — EKS Deploy*",
              "attachments": [{
                "color": "${{ needs.deploy.result == 'success' && 'good' || 'danger' }}",
                "fields": [
                  {"title": "Deploy",  "value": "${{ needs.deploy.result }}",  "short": true},
                  {"title": "DAST",    "value": "${{ needs.dast.result }}",    "short": true},
                  {"title": "Branch",  "value": "${{ github.ref_name }}",      "short": true},
                  {"title": "Commit",  "value": "${{ github.sha }}",           "short": true}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
