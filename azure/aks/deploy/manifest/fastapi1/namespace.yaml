---
apiVersion: v1
kind: Namespace
metadata:
  name: ${AKS_NAMESPACE}
  labels:
    app.kubernetes.io/name: fastapi-user-app
    environment: production
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-sa
  namespace: ${AKS_NAMESPACE}
  annotations:
    azure.workload.identity/client-id: ${AZURE_WORKLOAD_IDENTITY_CLIENT_ID}
