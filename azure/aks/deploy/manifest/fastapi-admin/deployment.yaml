---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  namespace: ${AKS_NAMESPACE}
  labels:
    app: ${APP_NAME}
    version: "${IMAGE_TAG}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${APP_NAME}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: ${APP_NAME}
        version: "${IMAGE_TAG}"
    spec:
      serviceAccountName: fastapi-admin-serviceaccount
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z $shost $sport; do sleep 3; done"]
          envFrom:
            - secretRef: { name: fastapi-admin-db-secret }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: fastapi-admin-app
          image: ${FASTAPI_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: 30443
          envFrom:
            - secretRef: { name: fastapi-admin-db-secret }
            - configMapRef: { name: fastapi-admin-config }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true    # gap fix: RO rootfs + emptyDir tmp
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: 30443, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 30443, scheme: HTTPS }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
