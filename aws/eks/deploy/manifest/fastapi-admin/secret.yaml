---
apiVersion: v1
kind: Secret
metadata:
  name: fastapi-admin-db-secret
  namespace: ${EKS_NAMESPACE}
type: Opaque
stringData:
  shost:      "${DB_HOST}"
  sport:      "${DB_PORT}"
  suser:      "${DB_USER}"
  spassword:  "${DB_PASSWORD}"
  sdatabase:  "${DB_NAME}"
  SECRET_KEY: "${JWT_SECRET_KEY}"
