---
apiVersion: v1
kind: Namespace
metadata:
  name: ${EKS_NAMESPACE}
  labels:
    app.kubernetes.io/name: fastapi-admin-app
    environment: production
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-admin-serviceaccount
  namespace: ${EKS_NAMESPACE}
  annotations:
    eks.amazonaws.com/role-arn: ${AWS_ROLE_ARN}
