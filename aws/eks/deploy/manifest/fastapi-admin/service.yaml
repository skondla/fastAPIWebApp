---
apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}
  namespace: ${EKS_NAMESPACE}
  labels:
    app: ${APP_NAME}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: ${APP_NAME}
  ports:
    - name: https
      port: ${APP_PORT}
      targetPort: 30443
      protocol: TCP
