---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  namespace: ${EKS_NAMESPACE}
  labels:
    app: ${APP_NAME}
    version: "${IMAGE_TAG}"
    app.kubernetes.io/name: ${APP_NAME}
    app.kubernetes.io/version: "${IMAGE_TAG}"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ${APP_NAME}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ${APP_NAME}
        version: "${IMAGE_TAG}"
      annotations:
        # Force redeploy on image change
        kubectl.kubernetes.io/restartedAt: "${IMAGE_TAG}"
    spec:
      serviceAccountName: fastapi-sa
      automountServiceAccountToken: false

      # ── Security Context (Pod) ──────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # ── Init: wait for DB ───────────────────────────────────────────────
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z "$shost" "$sport"; do
                echo "Waiting for DB at $shost:$sport..."; sleep 3
              done
          envFrom:
            - secretRef:
                name: fastapi-db-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: fastapi-user-app
          image: ${FASTAPI_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: 50443
              protocol: TCP

          # ── Environment from Secret + ConfigMap ──────────────────────
          envFrom:
            - secretRef:
                name: fastapi-db-secret
            - configMapRef:
                name: fastapi-config

          # ── Writable tmp dirs (root fs stays read-only) ──────────────
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp

          # ── Resource limits ──────────────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # ── Security Context (Container) ─────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true    # gap fix: RO rootfs + emptyDir tmp
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]

          # ── Probes ───────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /
              port: 50443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 50443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /
              port: 50443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

      # ── Topology spread for HA ──────────────────────────────────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ${APP_NAME}

      # ── emptyDir scratch space so the container root fs can be read-only ──
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}

      restartPolicy: Always
